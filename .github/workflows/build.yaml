name: build_and_test

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    strategy:
      # Do not let a failure in one Python version cancel the others.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15-dev", "3.15t-dev"]
    # Not all binary dependencies (notably pyarrow) publish wheels for the
    # unreleased interpreters yet, so failures there must not block a PR.
    continue-on-error: ${{ endsWith(matrix.python-version, '-dev') }}

    steps:
      - uses: actions/checkout@v7
        with:
          # Need to clone everything for the git tags.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Update pip/wheel infrastructure
        run: |
          python -m pip install --upgrade pip uv
          uv pip install --system wheel

      # Postgres-14 is already installed from official postgres repo, but we
      # also need pgsphere which is not installed. The repo is not in the list,
      # so we need to re-add it first. libpq-dev provides the pg_config and
      # headers needed to build psycopg2 from source on interpreters that do
      # not yet have binary wheels.
      - name: Install postgresql (server)
        run: |
          sudo sh -c \
            'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
          sudo apt-get update
          sudo apt-get install postgresql-14 postgresql-14-pgsphere libpq-dev

      - name: Install cryptography package for moto
        run: |
          uv pip install --system cryptography

      - name: Install dependencies
        run: |
          uv pip install --system -r requirements.txt

      # We have two cores so we can speed up the testing with xdist
      - name: Install pytest packages
        run: |
          uv pip install --system pytest pytest-xdist pytest-cov

      - name: List installed packages
        run: |
          python -c 'import sqlite3; print("sqlite", sqlite3.sqlite_version)'
          uv pip list -v

      - name: Build and install
        run: |
          uv pip install --system -v --no-deps -e .

      - name: Run tests
        env:
          SQLALCHEMY_WARN_20: 1
        run: |
          pytest -Wd -r a -v -n 3 --cov=lsst.daf.butler --cov=tests --cov-report=xml --cov-report=term --cov-branch \
            --junitxml=junit.xml -o junit_family=legacy
      - name: Upload coverage to codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}

  pypi:
    runs-on: ubuntu-latest
    needs: [build_and_test]
    # The "not starts with 's'" is meant to catch server release tags in the
    # form 'server/x.y.z'
    if: startsWith(github.ref, 'refs/tags') && ! startsWith(github.ref, 'refs/tags/s')

    steps:
      - uses: actions/checkout@v7
        with:
          # Need to clone everything to embed the version.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade setuptools wheel build

      - name: Build and create distribution
        run: |
          python -m build --skip-dependency-check

      - name: Upload
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_UPLOADS }}
