name: Run docstyle

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  call-workflow:
    uses: lsst/rubin_workflows/.github/workflows/docstyle.yaml@main
    with:
      args: "$(find python -name '*.py' | egrep -v 'parser/ply|parserYacc')"
  numpydoc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7

      - name: Install numpydoc
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpydoc

      - name: Validate docstrings
        shell: bash
        run: |
          mapfile -t files < <(find python -name "*.py")
          python -m numpydoc.hooks.validate_docstrings "${files[@]}"
