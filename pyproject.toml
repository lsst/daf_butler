[build-system]
requires = ["setuptools", "lsst-versions >= 1.3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lsst-daf-butler"
requires-python = ">=3.11.0"
description = "An abstraction layer for reading and writing astronomical data to datastores."
license = "BSD-3-Clause OR GPL-3.0-or-later"
license-files = ["COPYRIGHT", "LICENSE", "bsd_license.txt", "gpl-v3.0.txt"]
readme = "README.md"
authors = [
    {name="Rubin Observatory Data Management", email="dm-admin@lists.lsst.org"},
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
]
keywords = ["lsst"]
dependencies = [
    "astropy >=7.0",
    "pyyaml >=5.1",
    "sqlalchemy >=1.4",
    "click >= 7.0",
    "lsst-sphgeom",
    "lsst-utils",
    "lsst-resources",
    "deprecated >= 1.2",
    "pydantic >=2,<3.0",
    "pyarrow >= 0.16",
    "numpy",
]

dynamic = ["version"]
[project.urls]
"Homepage" = "https://github.com/lsst/daf_butler"
"Source" = "https://github.com/lsst/daf_butler"

[project.optional-dependencies]
postgres = ["psycopg2"]
remote = [
    "httpx",
    # RemoteButler always uses HTTPS URLs for accessing files in the Datastore,
    # so we need resources to have HTTPS support.
    "lsst-resources[https]"
]
server = [
    "fastapi",
    "lsst-resources[https,s3]",
    "safir >= 3.4.0",
    "sentry-sdk[fastapi,sqlalchemy]>=2.68.0",
    "uvicorn>=0.52.4",
]
test = [
    "pytest >= 3.2",
    "numpy >= 1.17",
    "matplotlib >= 3.0.3",
    "pandas >= 1.0, < 3.0",
]
# Also expose the optional dependencies of lsst-resources as optional
# dependencies of lsst-daf-butler.  lsst-daf-butler itself doesn't care what
# resource methods are available, but the client of lsst-daf-butler may view
# it as a black box and lsst-resources as an internal implementation detail,
# and therefore may find it more logical to specify optional dependencies
# here.
s3 = ["lsst-resources[s3]"]
https = ["lsst-resources[https]"]
gs = ["lsst-resources[gs]"]

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools]
zip-safe = true

[tool.setuptools.package-data]
"lsst.daf.butler" = ["py.typed", "configs/*.yaml", "configs/*/*.yaml", "tests/registry_data/*.yaml"]

[tool.setuptools.dynamic]
version = { attr = "lsst_versions.get_lsst_version" }

[project.scripts]
butler = "lsst.daf.butler.cli.butler:main"


[tool.towncrier]
    package = "lsst.daf.butler"
    package_dir = "python"
    filename = "doc/lsst.daf.butler/CHANGES.rst"
    directory = "doc/changes"
    title_format = "Butler {version} ({project_date})"
    issue_format = "`{issue} <https://rubinobs.atlassian.net/browse/{issue}>`_"

    [[tool.towncrier.type]]
        directory = "feature"
        name = "New Features"
        showcontent = true

    [[tool.towncrier.type]]
        directory = "api"
        name = "API Changes"
        showcontent = true

    [[tool.towncrier.type]]
        directory = "bugfix"
        name = "Bug Fixes"
        showcontent = true

    [[tool.towncrier.type]]
        directory = "perf"
        name = "Performance Enhancement"
        showcontent = true

    [[tool.towncrier.type]]
        directory = "misc"
        name = "Other Changes and Additions"
        showcontent = true

    [[tool.towncrier.type]]
        directory = "removal"
        name = "An API Removal or Deprecation"
        showcontent = true

[tool.black]
line-length = 110
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 110
known_first_party = ["lsst"]

[tool.lsst_versions]
write_to = "python/lsst/daf/butler/version.py"

[tool.pytest.ini_options]
# These require additional environment setup that isn't available during
# normal unit test runs
addopts = "--ignore=tests_integration"
xfail_strict = true
markers = [
    "postgres: test requires a postgres server",
    "server: test requires the butler server (needs the 'server' extra)",
    "slow: test is slow enough to be worth skipping during local iteration",
]

[tool.pydocstyle]
convention = "numpy"
# Our coding style does not require docstrings for magic methods (D105)
# Our docstyle documents __init__ at the class level (D107)
# We allow methods to inherit docstrings and this is not compatible with D102.
# Docstring at the very first line is not required
# D200, D205 and D400 all complain if the first sentence of the docstring does
# not fit on one line. We do not require docstrings in __init__ files (D104).
add-ignore = ["D107", "D105", "D102", "D100", "D200", "D205", "D400", "D104"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = [
    "__init__.py",
    "lex.py",
    "yacc.py",
]

[tool.ruff.lint]
ignore = [
    "N802",
    "N803",
    "N806",
    "N812",
    "N815",
    "N816",
    "N999",
    "D107",
    "D105",
    "D102",
    "D104",
    "D100",
    "D200",
    "D205",
    "D400",
    "UP007",  # Allow UNION in type annotation
]
select = [
    "E",  # pycodestyle
    "F",  # pycodestyle
    "N",  # pep8-naming
    "W",  # pycodestyle
    "D",  # pydocstyle
    "UP",  # pyupgrade
    "I",  # isort
    "RUF022",  # sort __all__
    "PT",  # flake8-pytest-style
]
# Commented out to suppress "unused noqa" in jenkins which has older ruff not
# generating E721.
extend-select = [
    "RUF100", # Warn about unused noqa
]

[tool.ruff.lint.per-file-ignores]
# parserYacc docstrings can not be fixed. Docstrings are used to define grammar.
"python/lsst/daf/butler/queries/expressions/parser/parserYacc.py" = ["D401", "D403"]

# flake8-pytest-style is a test-style ruleset and is scoped to tests/ only.
# Applying it to the library tree produces 893 findings: PT018 fires on ordinary
# library assertions, and PT009/PT027 fire on the shipped test suites in
# registry/tests/ and tests/butler_queries.py, which are converted by their own
# later tickets and get their own ratchet entries then.
"python/**" = ["PT"]

# Test functions do not need docstrings, matching the project's existing stance
# on D102 for test methods. Converting a test method to a module-level function
# would otherwise make a docstring mandatory where it previously was not.
"tests/*" = ["D103"]

# DM-55822 ratchet: test files not yet migrated to native pytest. Delete an
# entry when its file is converted; when this list is empty, delete the block.
# A file with no entry must be free of flake8-pytest-style violations, which
# is what stops the unittest idioms creeping back into converted files.
"tests_integration/test_docker_container.py" = ["PT"]
"tests/test_astropyTableFormatter.py" = ["PT"]
"tests/test_authentication.py" = ["PT"]
"tests/test_butler.py" = ["PT"]
"tests/test_butler_factory.py" = ["PT"]
"tests/test_cliCmdAssociate.py" = ["PT"]
"tests/test_cliCmdConfigDump.py" = ["PT"]
"tests/test_cliCmdConfigValidate.py" = ["PT"]
"tests/test_cliCmdCreate.py" = ["PT"]
"tests/test_cliCmdImport.py" = ["PT"]
"tests/test_cliCmdIngestFiles.py" = ["PT"]
"tests/test_cliCmdPruneDatasets.py" = ["PT"]
"tests/test_cliCmdQueryCollections.py" = ["PT"]
"tests/test_cliCmdQueryDataIds.py" = ["PT"]
"tests/test_cliCmdQueryDatasets.py" = ["PT"]
"tests/test_cliCmdQueryDatasetTypes.py" = ["PT"]
"tests/test_cliCmdQueryDimensionRecords.py" = ["PT"]
"tests/test_cliCmdRemoveCollections.py" = ["PT"]
"tests/test_cliCmdRemoveRuns.py" = ["PT"]
"tests/test_cliCmdRetrieveArtifacts.py" = ["PT"]
"tests/test_cliLog.py" = ["PT"]
"tests/test_cliPluginLoader.py" = ["PT"]
"tests/test_cliUtils.py" = ["PT"]
"tests/test_cliUtilSplitCommas.py" = ["PT"]
"tests/test_cliUtilSplitKv.py" = ["PT"]
"tests/test_cliUtilToUpper.py" = ["PT"]
"tests/test_column_spec.py" = ["PT"]
"tests/test_composites.py" = ["PT"]
"tests/test_config.py" = ["PT"]
"tests/test_connectionString.py" = ["PT"]
"tests/test_constraints.py" = ["PT"]
"tests/test_datasets.py" = ["PT"]
"tests/test_ddl.py" = ["PT"]
"tests/test_dimension_record_containers.py" = ["PT"]
"tests/test_dimensions_versions.py" = ["PT"]
"tests/test_dimensions.py" = ["PT"]
"tests/test_exprParserLex.py" = ["PT"]
"tests/test_exprParserYacc.py" = ["PT"]
"tests/test_formatter.py" = ["PT"]
"tests/test_gafaelfawr.py" = ["PT"]
"tests/test_location.py" = ["PT"]
"tests/test_logFormatter.py" = ["PT"]
"tests/test_logging.py" = ["PT"]
"tests/test_matplotlibFormatter.py" = ["PT"]
"tests/test_nonempty_mapping.py" = ["PT"]
"tests/test_obscore.py" = ["PT"]
"tests/test_packages.py" = ["PT"]
"tests/test_parquet.py" = ["PT"]
"tests/test_postgresql.py" = ["PT"]
"tests/test_progress.py" = ["PT"]
"tests/test_pydantic_utils.py" = ["PT"]
"tests/test_quantum.py" = ["PT"]
"tests/test_quantumBackedButler.py" = ["PT"]
"tests/test_query_direct_postgresql.py" = ["PT"]
"tests/test_query_direct_sqlite.py" = ["PT"]
"tests/test_query_interface.py" = ["PT"]
"tests/test_query_remote.py" = ["PT"]
"tests/test_query_utilities.py" = ["PT"]
"tests/test_registry_dataset_type_overrides.py" = ["PT"]
"tests/test_remote_butler.py" = ["PT"]
"tests/test_repo_template_cache.py" = ["PT"]
"tests/test_server.py" = ["PT"]
"tests/test_simpleButler.py" = ["PT"]
"tests/test_sqlite.py" = ["PT"]
"tests/test_storageClass.py" = ["PT"]
"tests/test_templates.py" = ["PT"]
"tests/test_testRepo.py" = ["PT"]
"tests/test_thread_utils.py" = ["PT"]
"tests/test_time_utils.py" = ["PT"]
"tests/test_timespan.py" = ["PT"]
"tests/test_utils.py" = ["PT"]
"tests/test_uuid.py" = ["PT"]
"tests/test_versioning.py" = ["PT"]

[tool.ruff.lint.isort]
known-first-party = ["lsst"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 79

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
docstring-code-format = true
# Formatter does not know about indenting.
docstring-code-line-length = 69

[tool.numpydoc_validation]
checks = [
    "all",  # All except the rules listed below.
    "SA01",  # See Also section.
    "SA04",  # We don't use descriptions with See Also.
    "EX01",  # Example section.
    "SS06",  # Summary can go into second line.
    "GL01",  # Summary text can start on same line as """
    "GL08",  # Do not require docstring.
    "ES01",  # No extended summary required.
    "RT01",  # Unfortunately our @property trigger this.
    "RT02",  # Does not want named return value. DM style says we do.
    "SS05",  # pydocstyle is better at finding infinitive verb.
    "RT03",  # Temporarily disable for sphinx empty returns.
    "PR04",  # New Sphinx can infer types from python typing
]
exclude = [
    "^test_.*",  # Do not test docstrings in test code.
    '^spatial\..*',  # Do not test doc strings in the spatial.py test code.
    '^lex\..*',  # Lexer
    '^parserLex\.',  # Docstrings are not numpydoc
    '^parserYacc\.',  # Docstrings are not numpydoc
    '^commands\.',  # Click docstrings, not numpydoc
    'butler.cli$',  # This is the main click command
    '^__init__$',
    '\._[a-zA-Z_]+$',  # Private methods.
]

[dependency-groups]
dev = [
    "cryptography>=49",
    "lsst-daf-butler[postgres,remote,server,s3,https]",
    "fsspec>=2026.7.0",
    "matplotlib>=3.11.1",
    "moto>=5.2.2",
    "mypy>=2.3.1",
    "numpy>=2.4.6",
    "pandas>=2.3.3",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    # Optional convenience: tests/conftest.py applies a default timeout only
    # when this is installed, so environments without it are unaffected.
    "pytest-timeout>=2.3.0",
    "pytest-xdist>=3.8.0",
    "testing-postgresql>=1.3.0",
    "types-deprecated>=1.3.1.20260728",
    "types-pyyaml>=6.0.12.20260815",
    "types-requests>=2.33.0.20260712",
]
doc = [
    "documenteer[guide]>2.0,<3.0",
    "lsst-sphinxutils @ git+https://github.com/lsst/sphinxutils@main",
    "sphinx-click>=6.2.0",
]
dockertest = [
    "testcontainers"
]

[tool.uv]
# override-dependencies is here to specify the versions of these libraries to
# use when doing daf_butler development, but not for downstream consumers.
# This is not using [tool.uv.sources] as you normally would because that breaks
# downstream packages trying to install LSST packages using
# `uv pip install -r requirements.txt`, due to a bug in uv
# https://github.com/astral-sh/uv/issues/11452
override-dependencies = [
    "lsst-utils @ git+https://github.com/lsst/utils@main",
    "lsst-resources[https,s3] @ git+https://github.com/lsst/resources@main",
]

[tool.uv.dependency-groups]
# Documenteer needs Python 3.12 or higher, but Butler itself still
# supports 3.11.
doc = {requires-python = ">=3.12"}
